COLOR = 0.55,0.6,1 			; RGB blend - 0,0,0 is black, 1,1,1 is white
LIFE = 2, 2 				; how long particles last in the air before disappearing
SPEED = 1.1, 6 				; how fast smoke particles fly from the exhaust
SPREAD = 0.1				; initial spread of particles
STARTING_SIZE = 0.04			; initial size of particles
SPAWN_OFFSET = 0.01			; initial spawn point offset (length-wise)
INTENSITY = 0.25, 0.15			; smoke intensity
TEMPERATURE_LAG = 1 			; engine heating up (1 to disable)
SPEED_THRESHOLD = 15, 130 		; speed at which the smoke disappears


