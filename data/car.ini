[HEADER]
VERSION=extended-2

[_EXTENSION]
RAIN_DEV=1

[_EXTENSION_DRIVER]
MASS=150                 ; mass of a driver (should also be included in car mass, as usual)
SHIFT_RANGE=0.3         ; physical shift range
SHIFT_VISUAL_RANGE=0.5  ; visual shift range
NEGATIVE_MASS=1         ; if set to 1, neutral driver position won’t shift center of gravity
SHIFT_MULTIPLIER=0.25   ; how much of driver mass actually moves (drivers realistically would on

[INFO]
SCREEN_NAME=1923 Bugatti Type 22						; Name of the car. Used on info apps ingame and to identify the car on servers etc.
SHORT_NAME=23 T22

[BASIC]
GRAPHICS_OFFSET=0.0,-0.48,-0.52			; 3 axis correction (x(left-right),y(up-down),z(forward-backward), applies only to the 3D object of the car (meters)
GRAPHICS_PITCH_ROTATION=0				; Changes 3D object rotation in pitch (degrees)
TOTALMASS=780							; Total vehicle weight in kg with driver and no fuel
INERTIA=0.85,1.25,3.50						; Car polar inertia. Calculated from the car dimensions. Start with the generic width,height,length and modify accordingly to the car's configuration 

[GRAPHICS]
DRIVEREYES=-0.204575,1.31289,-0.197437
ONBOARD_EXPOSURE=38
OUTBOARD_EXPOSURE=38
ON_BOARD_PITCH_ANGLE=-1.999899
BUMPER_CAMERA_POS=0.000000,0.651203,2.000000
BONNET_CAMERA_POS=0.000000,0.700000,0.100000
MIRROR_POSITION=0.0,1.0,0.5 ; Position used to render the mirror
VIRTUAL_MIRROR_ENABLED=1
SHAKE_MUL=1.0				; Camera onboard G forces multiplier
USE_ANIMATED_SUSPENSIONS=0
FUEL_LIGHT_MIN_LITERS=7
BUMPER_CAMERA_PITCH=0.000000
BONNET_CAMERA_PITCH=-3.999799
CHASE_CAMERA_PITCH=0

[CONTROLS]
FFMULT=3.8
STEER_ASSIST=1.000
STEER_LOCK=360								; Real car's steer lock from center to right
STEER_RATIO=16.0							; Steer ratio
LINEAR_STEER_ROD_RATIO=0.00220				; Because of AC complex suspension geometry, you need to calculate manually the steer rod ratio
; Enter AC in dev app mode enabled
; Open SUSPENSIONS app
; turn your steering wheel by 90 degrees
; check the actual steer ratio value
; modify LINEAR_STEER_ROD_RATIO value until ingame steer ratio and car.ini STEER_RATIO values are similar

[FUEL]
CONSUMPTION=0.00221					; (19.3 kmpg, 4.25 kmpl) fuel consumption. In one second the consumption is (rpm*gas*CONSUMPTION)/1000 litres
FUEL=30										; default starting fuel in litres
MAX_FUEL=60									; max fuel in litres

[FUEL_EXT]
KG_PER_LITER=0.735                             ; 1920s petrol fuel density in kg/liter. Used to calculate fuel mass and its effect on the car's weight and balance

[FUELTANK]
POSITION=0,-0.1,-1.50					; Position of fuel tank from CoG in meters

[RIDE]
PICKUP_FRONT_HEIGHT=-0.189						; Height of the front ride height pickup point in meters WRT cg
PICKUP_REAR_HEIGHT=-0.184						; Height of the rear ride height pickup point in meters WRT cg

[RULES]
MIN_HEIGHT=0.35   								; meters minimum height rule front/rear

[PIT_STOP]
TYRE_CHANGE_TIME_SEC=180
FUEL_LITER_TIME_SEC=1.0
BODY_REPAIR_TIME_SEC=60
ENGINE_REPAIR_TIME_SEC=20
SUSP_REPAIR_TIME_SEC=120
